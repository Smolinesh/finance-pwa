<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#111827">
    <title>Finance Tracker</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased select-none touch-manipulation">

    <!-- Auth Screen -->
    <div id="auth-screen" class="flex flex-col items-center justify-center min-h-screen p-4 pb-safe">
        <h1 class="text-2xl font-bold mb-8">Введіть PIN</h1>
        <div class="flex gap-6 mb-12" id="pin-indicators">
            <div class="w-4 h-4 rounded-full bg-gray-700 pin-dot transition-colors duration-200"></div>
            <div class="w-4 h-4 rounded-full bg-gray-700 pin-dot transition-colors duration-200"></div>
            <div class="w-4 h-4 rounded-full bg-gray-700 pin-dot transition-colors duration-200"></div>
            <div class="w-4 h-4 rounded-full bg-gray-700 pin-dot transition-colors duration-200"></div>
        </div>
        <div class="grid grid-cols-3 gap-4 w-72 max-w-full" id="numpad">
            <!-- Numpad генерується через JS -->
        </div>
    </div>

    <!-- Main App Screen (Hidden) -->
    <div id="app-screen" class="hidden h-screen flex flex-col pt-safe pb-safe">
        <header class="p-4 border-b border-gray-800 flex justify-between items-center shrink-0">
            <h1 class="text-xl font-bold">Огляд</h1>
            <button id="btn-sync" class="text-blue-400 font-medium">Синхронізувати</button>
        </header>
        
        <main class="flex-1 overflow-y-auto p-4 space-y-6">
            <div class="bg-gray-800 p-5 rounded-2xl shadow-lg border border-gray-700">
                <p class="text-gray-400 text-sm font-medium mb-1">Баланс (PLN)</p>
                <p class="text-4xl font-bold">0.00</p>
            </div>
            <!-- Графіки та списки будуть тут -->
        </main>
        
        <nav class="border-t border-gray-800 p-2 flex justify-around shrink-0 bg-gray-900/95 backdrop-blur">
            <button class="p-3 text-blue-400 flex flex-col items-center gap-1">
                <span class="text-xs font-semibold">Головна</span>
            </button>
            <button class="p-3 text-gray-500 flex flex-col items-center gap-1 relative">
                <span class="text-xs font-semibold">Inbox</span>
                <span class="absolute top-2 right-1 flex h-2 w-2 rounded-full bg-red-500 hidden"></span>
            </button>
            <button class="p-3 text-gray-500 flex flex-col items-center gap-1">
                <span class="text-xs font-semibold">Аналітика</span>
            </button>
        </nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
