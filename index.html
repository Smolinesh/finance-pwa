<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#111827">
    <title>Finance Tracker</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <style>
        .safe-pt { padding-top: max(1.5rem, env(safe-area-inset-top)); }
        .safe-pb { padding-bottom: max(1.5rem, env(safe-area-inset-bottom)); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased select-none touch-manipulation">

    <!-- Auth Screen -->
    <div id="auth-screen" class="flex flex-col items-center justify-center min-h-screen p-4 safe-pb z-50 bg-gray-900 relative">
        <h1 class="text-2xl font-bold mb-8">Введіть PIN</h1>
        <div class="flex gap-6 mb-12">
            <div class="w-4 h-4 rounded-full bg-gray-700 pin-dot transition-colors duration-200"></div>
            <div class="w-4 h-4 rounded-full bg-gray-700 pin-dot transition-colors duration-200"></div>
            <div class="w-4 h-4 rounded-full bg-gray-700 pin-dot transition-colors duration-200"></div>
            <div class="w-4 h-4 rounded-full bg-gray-700 pin-dot transition-colors duration-200"></div>
        </div>
        <div class="grid grid-cols-3 gap-4 w-72 max-w-full" id="numpad"></div>
    </div>

    <!-- Main App Layout -->
    <div id="app-screen" class="hidden h-screen flex-col relative">
        
        <!-- Header -->
        <header class="safe-pt px-4 pb-3 border-b border-gray-800 flex justify-between items-end shrink-0 bg-gray-900/95 backdrop-blur z-10">
            <h1 class="text-2xl font-bold tracking-tight" id="header-title">Огляд</h1>
            <button id="btn-sync" class="text-blue-400 font-semibold text-sm py-1 px-2 bg-blue-500/10 rounded-lg active:bg-blue-500/20 transition-colors">Синхронізувати</button>
        </header>
        
        <!-- View: Overview -->
        <main id="view-overview" class="flex-1 overflow-y-auto p-4 space-y-6 no-scrollbar">
            <div class="bg-gray-800 p-6 rounded-3xl shadow-lg border border-gray-700/50 relative overflow-hidden">
                <div class="absolute top-0 right-0 -mt-4 -mr-4 w-24 h-24 bg-blue-500/20 rounded-full blur-2xl pointer-events-none"></div>
                <p class="text-gray-400 text-sm font-medium mb-2 uppercase tracking-wider">Загальний Баланс</p>
                <div class="flex items-baseline gap-1">
                    <p class="text-4xl font-bold tracking-tight" id="balance-display">0.00</p>
                    <span class="text-gray-400 font-semibold text-lg">PLN</span>
                </div>
            </div>
            <div class="space-y-3" id="transactions-container">
                <h2 class="text-lg font-semibold text-gray-300">Останні операції</h2>
            </div>
        </main>

        <!-- View: Inbox -->
        <main id="view-inbox" class="hidden flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar bg-gray-900">
            <div class="bg-yellow-500/10 border border-yellow-500/30 rounded-2xl p-4 mb-4">
                <p class="text-yellow-400 text-sm font-medium">Транзакції, що потребують уточнення категорії або суми конвертації.</p>
            </div>
            <div class="space-y-3" id="inbox-container"></div>
        </main>

        <!-- View: Analytics -->
        <main id="view-analytics" class="hidden flex-1 overflow-y-auto p-4 space-y-6 no-scrollbar bg-gray-900">
            <div class="flex bg-gray-800 p-1 rounded-xl">
                <button onclick="setPeriod('today')" id="period-today" class="period-btn flex-1 py-1.5 text-xs font-semibold rounded-lg text-gray-400">Сьогодні</button>
                <button onclick="setPeriod('week')" id="period-week" class="period-btn flex-1 py-1.5 text-xs font-semibold rounded-lg text-gray-400">Тиждень</button>
                <button onclick="setPeriod('month')" id="period-month" class="period-btn flex-1 py-1.5 text-xs font-semibold rounded-lg bg-gray-700 text-white shadow">Місяць</button>
                <button onclick="setPeriod('all')" id="period-all" class="period-btn flex-1 py-1.5 text-xs font-semibold rounded-lg text-gray-400">Всі</button>
            </div>
            
            <div class="relative w-56 h-56 mx-auto my-4">
                <canvas id="analytics-chart"></canvas>
                <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none mt-2">
                    <span class="text-[10px] text-gray-500 uppercase tracking-widest">Витрати</span>
                    <span id="analytics-total" class="text-xl font-bold text-white">0.00</span>
                </div>
            </div>
            
            <div class="space-y-2" id="analytics-categories"></div>
        </main>

        <!-- FAB Add Button -->
        <button id="btn-add-modal" class="absolute bottom-24 right-4 w-14 h-14 bg-blue-600 rounded-full flex items-center justify-center shadow-lg shadow-blue-600/30 active:bg-blue-700 transition-transform active:scale-95 z-20">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>
        </button>

        <!-- Bottom Navigation -->
        <nav class="safe-pb pt-2 px-2 border-t border-gray-800 flex justify-around shrink-0 bg-gray-900/95 backdrop-blur z-10">
            <button id="nav-overview" class="p-2 text-blue-400 flex flex-col items-center gap-1.5 w-16 nav-btn" onclick="switchTab('overview')">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                <span class="text-[10px] font-bold">Огляд</span>
            </button>
            <button id="nav-inbox" class="p-2 text-gray-500 flex flex-col items-center gap-1.5 w-16 relative nav-btn" onclick="switchTab('inbox')">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" /></svg>
                <span class="text-[10px] font-bold">Inbox</span>
                <span id="inbox-badge" class="absolute top-1 right-2 flex h-2.5 w-2.5 rounded-full bg-red-500 hidden border-2 border-gray-900"></span>
            </button>
            <button id="nav-analytics" class="p-2 text-gray-500 flex flex-col items-center gap-1.5 w-16 nav-btn" onclick="switchTab('analytics')">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
                <span class="text-[10px] font-bold">Аналітика</span>
            </button>
        </nav>
    </div>

    <!-- Modals -->
    <!-- Add Modal -->
    <div id="add-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex-col justify-end">
        <div class="bg-gray-900 rounded-t-3xl p-6 safe-pb transform transition-transform border-t border-gray-800">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">Нова операція</h2>
                <button onclick="document.getElementById('add-modal').classList.add('hidden')" class="p-2 text-gray-400"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg></button>
            </div>
            <div class="space-y-4">
                <div class="flex bg-gray-800 p-1 rounded-xl">
                    <button id="type-expense" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-gray-700 text-white shadow tx-type-btn">Витрата</button>
                    <button id="type-income" class="flex-1 py-2 text-sm font-semibold rounded-lg text-gray-400 tx-type-btn">Дохід</button>
                </div>
                <input type="number" id="input-amount" inputmode="decimal" placeholder="0.00" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-4 text-3xl font-bold text-center text-white">
                <div class="grid grid-cols-2 gap-3">
                    <select id="input-account" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white appearance-none"><option value="Everyday">Everyday</option><option value="Cash">Cash</option></select>
                    <select id="input-category" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white appearance-none">
                        <option value="Продукти">Продукти</option><option value="Транспорт">Транспорт</option><option value="Розваги">Розваги</option><option value="Інше">Інше</option>
                    </select>
                </div>
                <input type="text" id="input-desc" placeholder="Коментар" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white">
                <button id="btn-submit-tx" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl mt-2 active:bg-blue-700 shadow-lg shadow-blue-600/20">Зберегти</button>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex-col justify-end">
        <div class="bg-gray-900 rounded-t-3xl p-6 safe-pb transform transition-transform border-t border-gray-800">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-yellow-500">Редагування Inbox</h2>
                <button onclick="document.getElementById('edit-modal').classList.add('hidden')" class="p-2 text-gray-400"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg></button>
            </div>
            <div class="space-y-4">
                <input type="hidden" id="edit-id">
                <div>
                    <label class="text-xs text-gray-400 ml-1 mb-1 block">Опис</label>
                    <input type="text" id="edit-desc" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm text-gray-300">
                </div>
                <div>
                    <label class="text-xs text-gray-400 ml-1 mb-1 block">Сума (PLN)</label>
                    <input type="number" id="edit-amount" inputmode="decimal" placeholder="0.00" class="w-full bg-gray-800 border border-yellow-700 rounded-xl px-4 py-4 text-3xl font-bold text-center text-white">
                </div>
                <div>
                    <label class="text-xs text-gray-400 ml-1 mb-1 block">Категорія</label>
                    <select id="edit-category" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white appearance-none">
                        <option value="Продукти">Продукти</option><option value="Транспорт">Транспорт</option><option value="Розваги">Розваги</option><option value="Інше">Інше</option>
                    </select>
                </div>
                <button id="btn-submit-edit" class="w-full bg-yellow-600 text-white font-bold py-4 rounded-xl mt-4 active:bg-yellow-700">Оновити</button>
            </div>
        </div>
    </div>

    <script>
        const PIN = "1236";
        let currentPin = "";
        
        // ВСТАВ СВІЙ АКТУАЛЬНИЙ URL ТУТ!
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbytL2ufOGqB41nK5Jb-N_NAvCirShM6NaBgq7D87s1_bp2NpA-cXTNLrOwjX-GLOPfp/exec";

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.error));
        }

        // Init Auth Numpad
        const numpad = document.getElementById('numpad');
        [1, 2, 3, 4, 5, 6, 7, 8, 9, 'ID', 0, 'C'].forEach(key => {
            const btn = document.createElement('button');
            btn.className = "h-16 flex items-center justify-center text-2xl font-medium bg-gray-800/80 rounded-2xl active:bg-gray-700 border border-gray-700/50 shadow-sm";
            btn.innerHTML = key === 'ID' ? `<span class="text-sm text-blue-400 font-bold">FaceID</span>` : key === 'C' ? `<span class="text-xl font-bold text-red-400">C</span>` : key;
            btn.onclick = () => {
                if (key === 'C') currentPin = currentPin.slice(0, -1);
                else if (key === 'ID') return;
                else if (currentPin.length < 4) currentPin += key;
                
                document.querySelectorAll('.pin-dot').forEach((dot, i) => dot.classList.toggle('bg-blue-500', i < currentPin.length));
                
                if (currentPin.length === 4) {
                    setTimeout(() => {
                        if (currentPin === PIN) {
                            document.getElementById('auth-screen').classList.add('hidden');
                            document.getElementById('app-screen').classList.remove('hidden');
                            document.getElementById('app-screen').classList.add('flex');
                            syncData();
                            processOfflineQueue();
                        } else {
                            currentPin = "";
                            document.querySelectorAll('.pin-dot').forEach(dot => dot.classList.remove('bg-blue-500'));
                            if (navigator.vibrate) navigator.vibrate(200);
                        }
                    }, 100);
                }
            };
            numpad.appendChild(btn);
        });

        // Tab Switcher
        function switchTab(tab) {
            const views = ['overview', 'inbox', 'analytics'];
            const titles = { 'overview': 'Огляд', 'inbox': 'Inbox', 'analytics': 'Аналітика' };
            
            views.forEach(v => {
                document.getElementById(`view-${v}`).classList.toggle('hidden', v !== tab);
                const nav = document.getElementById(`nav-${v}`);
                nav.classList.toggle('text-blue-400', v === tab);
                nav.classList.toggle('text-gray-500', v !== tab);
            });
            document.getElementById('header-title').textContent = titles[tab];
            if (tab === 'analytics') updateAnalytics();
        }

        // Fetch Data
        let globalTransactions = [];
        async function syncData() {
            const btn = document.getElementById('btn-sync');
            btn.textContent = "Оновл...";
            try {
                if (!navigator.onLine) return btn.textContent = "Офлайн";
                const res = await fetch(WEB_APP_URL);
                const data = await res.json();
                
                if(data.status === "success") {
                    document.getElementById('balance-display').textContent = data.balance;
                    globalTransactions = data.transactions;
                    renderTransactions();
                    updateAnalytics();
                }
            } catch (err) { console.error(err); } 
            finally { if (navigator.onLine) btn.textContent = "Синхронізувати"; }
        }
        document.getElementById('btn-sync').addEventListener('click', syncData);

        function renderTransactions() {
            const txCont = document.getElementById('transactions-container');
            const inxCont = document.getElementById('inbox-container');
            const badge = document.getElementById('inbox-badge');
            
            txCont.innerHTML = '<h2 class="text-lg font-semibold text-gray-300">Останні операції</h2>';
            inxCont.innerHTML = '';
            let inboxCount = 0;

            if (globalTransactions.length === 0) return txCont.innerHTML += `<div class="bg-gray-800/50 rounded-2xl p-4 text-center text-gray-500 text-sm">Немає транзакцій.</div>`;

            globalTransactions.forEach(tx => {
                const isExpense = tx.type === 'Expense';
                const color = isExpense ? 'text-gray-100' : 'text-green-400';
                const isInbox = tx.category === 'Нерозподілене' || tx.category === '⚠️ Очікує конвертації';
                
                const html = `
                <div class="bg-gray-800/50 rounded-2xl p-4 flex justify-between items-center border border-gray-800 ${isInbox ? 'active:bg-gray-700 cursor-pointer border-yellow-600/30' : ''}" 
                     ${isInbox ? `onclick="openEdit('${tx.id}')"` : ''}>
                    <div>
                        <p class="font-medium text-gray-200">${tx.description || tx.category}</p>
                        <p class="text-xs ${isInbox ? 'text-yellow-500' : 'text-gray-500'} mt-1">${tx.category} • ${tx.date}</p>
                    </div>
                    <p class="font-bold ${color}">${isExpense ? '-' : '+'}${parseFloat(tx.amount).toFixed(2)}</p>
                </div>`;
                
                if (isInbox) { inxCont.innerHTML += html; inboxCount++; } else { txCont.innerHTML += html; }
            });

            badge.classList.toggle('hidden', inboxCount === 0);
            if (inboxCount === 0) inxCont.innerHTML = `<div class="text-center text-gray-500 py-8">Inbox порожній 🎉</div>`;
        }

        // --- Analytics Logic ---
        let chartInstance = null;
        let currentPeriod = 'month';
        let excludedCats = new Set();
        const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#14b8a6', '#6366f1'];

        function parseTxDate(dateStr) {
            if (!dateStr) return new Date();
            if (dateStr.includes('T')) return new Date(dateStr); // From offline queue
            const parts = dateStr.split(' ');
            if (parts.length > 0 && parts[0].includes('.')) {
                const [day, month] = parts[0].split('.');
                return new Date(new Date().getFullYear(), parseInt(month) - 1, parseInt(day));
            }
            return new Date();
        }

        function setPeriod(p) {
            currentPeriod = p;
            document.querySelectorAll('.period-btn').forEach(b => {
                b.classList.replace('bg-gray-700', 'text-gray-400');
                b.classList.remove('text-white', 'shadow');
            });
            const active = document.getElementById(`period-${p}`);
            active.classList.replace('text-gray-400', 'bg-gray-700');
            active.classList.add('text-white', 'shadow');
            updateAnalytics();
        }

        function updateAnalytics() {
            const now = new Date();
            let expenses = globalTransactions.filter(tx => tx.type === 'Expense');

            // 1. Filter Period
            expenses = expenses.filter(tx => {
                if (currentPeriod === 'all') return true;
                const d = parseTxDate(tx.date);
                const diffDays = Math.ceil(Math.abs(now - d) / (1000 * 60 * 60 * 24));
                
                if (currentPeriod === 'today') return diffDays <= 1 && d.getDate() === now.getDate();
                if (currentPeriod === 'week') return diffDays <= 7;
                if (currentPeriod === 'month') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                return true;
            });

            // 2. Aggregate Categories
            const totals = {};
            expenses.forEach(tx => {
                const cat = tx.category || 'Інше';
                totals[cat] = (totals[cat] || 0) + parseFloat(tx.amount);
            });

            // 3. Render Chart
            const labels = [];
            const data = [];
            let totalSum = 0;

            Object.keys(totals).sort((a,b) => totals[b]-totals[a]).forEach((cat, i) => {
                if (!excludedCats.has(cat)) {
                    labels.push(cat);
                    data.push(totals[cat]);
                    totalSum += totals[cat];
                }
            });

            document.getElementById('analytics-total').textContent = totalSum.toFixed(2);
            renderChart(labels, data);
            renderCatList(totals);
        }

        function renderChart(labels, data) {
            const ctx = document.getElementById('analytics-chart');
            if (chartInstance) chartInstance.destroy();
            
            if (data.length === 0) {
                chartInstance = new Chart(ctx, {
                    type: 'doughnut',
                    data: { labels: ['Немає даних'], datasets: [{ data: [1], backgroundColor: ['#374151'], borderWidth: 0 }] },
                    options: { cutout: '80%', plugins: { legend: { display: false }, tooltip: { enabled: false } } }
                });
                return;
            }

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: labels, datasets: [{ data: data, backgroundColor: colors, borderWidth: 0 }] },
                options: { cutout: '80%', plugins: { legend: { display: false } } }
            });
        }

        function renderCatList(totals) {
            const cont = document.getElementById('analytics-categories');
            cont.innerHTML = '';
            
            Object.entries(totals).sort((a,b) => b[1]-a[1]).forEach(([cat, sum], i) => {
                const isExc = excludedCats.has(cat);
                const color = colors[i % colors.length];
                
                cont.innerHTML += `
                <div class="flex justify-between items-center bg-gray-800/40 p-3 rounded-xl border border-gray-700 cursor-pointer ${isExc ? 'opacity-40 grayscale' : ''}"
                     onclick="toggleAnalyticsCat('${cat}')">
                    <div class="flex items-center gap-3">
                        <div class="w-3 h-3 rounded-full" style="background-color: ${isExc ? '#4b5563' : color}"></div>
                        <span class="text-sm font-medium text-gray-200">${cat}</span>
                    </div>
                    <span class="text-sm font-bold text-gray-100">${sum.toFixed(2)}</span>
                </div>`;
            });
        }

        function toggleAnalyticsCat(cat) {
            if (excludedCats.has(cat)) excludedCats.delete(cat); else excludedCats.add(cat);
            updateAnalytics();
        }

        // Offline / Modals / Submit Logic 
        const addModal = document.getElementById('add-modal');
        let currentTxType = 'Expense';
        document.getElementById('btn-add-modal').onclick = () => addModal.classList.remove('hidden');
        
        document.querySelectorAll('.tx-type-btn').forEach(btn => {
            btn.onclick = (e) => {
                document.querySelectorAll('.tx-type-btn').forEach(b => { b.classList.replace('bg-gray-700', 'text-gray-400'); b.classList.remove('text-white', 'shadow'); });
                e.target.classList.replace('text-gray-400', 'bg-gray-700'); e.target.classList.add('text-white', 'shadow');
                currentTxType = e.target.textContent === 'Витрата' ? 'Expense' : 'Income';
            };
        });

        async function processOfflineQueue() {
            let queue = JSON.parse(localStorage.getItem('offlineTxQueue')) || [];
            if (queue.length === 0) return;
            let remainingQueue = [];
            for (let i = 0; i < queue.length; i++) {
                try {
                    const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(queue[i]) });
                    if ((await res.
